{% extends 'main/base.html' %}
{% load static %}

{% block content %}
<section class="container py-5">
  <div class="text-center mb-4">
    <h2 class="fw-bold display-5 mb-3">Our Gallery</h2>
    <p class="text-muted lead">A glimpse of our sweet creations</p>
  </div>

  <div class="row g-4">
    {% for image in images %}
    <div class="col-6 col-md-4 col-lg-3">
      <div class="card border-0 shadow-sm h-100 overflow-hidden hover-scale">
        <div class="gallery-img-wrapper position-relative">
          <img src="{{ image.image.url }}"
               class="gallery-img img-fluid"
               alt="{{ image.title }}"
               loading="lazy">
          <div class="img-overlay position-absolute top-0 start-0 w-100 h-100 bg-dark opacity-0 transition-all">
            <button class="btn btn-light btn-sm position-absolute top-50 start-50 translate-middle"
                    data-bs-toggle="modal"
                    data-bs-target="#galleryModal"
                    onclick="showImage('{{ image.image.url|escapejs }}', '{{ image.title|escapejs }}')">
              View Full Size
            </button>
          </div>
        </div>
        <div class="card-body text-center">
          <h6 class="card-title mb-0">{{ image.title }}</h6>
        </div>
      </div>
    </div>
    {% empty %}
    <div class="col-12 text-center py-5">
      <div class="alert alert-info">No images available yet. Check back soon!</div>
    </div>
    {% endfor %}
  </div>
</section>

<!-- Modal -->
<div class="modal fade" id="galleryModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-xl">
    <div class="modal-content border-0 shadow-lg">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title fs-5" id="modalTitle"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-4">
        <div class="ratio ratio-1x1">
          <img id="modalImage" class="img-fluid object-fit-contain bg-light rounded-3" alt="Selected Design">
        </div>
      </div>
      <div class="modal-footer border-0 justify-content-center">
        <a id="orderButton" href="#" class="btn btn-warning fw-semibold px-5 py-2">
          <i class="bi bi-cart3 me-2"></i>Order This Design
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  function showImage(src, title) {
    const modalImage = document.getElementById("modalImage");
    const modalTitle = document.getElementById("modalTitle");
    const orderButton = document.getElementById("orderButton");

    modalImage.src = src;
    modalImage.alt = title;
    modalTitle.textContent = title;
    orderButton.href = "{% url 'order' %}?item=" + encodeURIComponent(title);
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('.hover-scale').forEach(card => {
      const overlay = card.querySelector('.img-overlay');
      card.addEventListener('mouseenter', () => overlay.style.opacity = '0.9');
      card.addEventListener('mouseleave', () => overlay.style.opacity = '0');
    });
  });
</script>
{% endblock %}
