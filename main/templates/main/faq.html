{% extends 'main/base.html' %}
{% block content %}
<section class="container py-5">
  <div class="text-center mb-5">
    <h2 class="fw-bold">Frequently Asked Questions</h2>
    <p class="text-muted">Here’s everything you need to know before you order.</p>
  </div>

  <div class="accordion" id="faqAccordion" role="tablist">
    {% for faq in faqs %}
      <div class="accordion-item">
        <h2 class="accordion-header" id="q{{ faq.0 }}">
          <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#a{{ faq.0 }}" 
                  aria-expanded="false" aria-controls="a{{ faq.0 }}" role="button">
            {{ faq.1 }}
          </button>
        </h2>
        <div id="a{{ faq.0 }}" class="accordion-collapse collapse" aria-labelledby="q{{ faq.0 }}" data-bs-parent="#faqAccordion">
          <div class="accordion-body">
            {{ faq.2|safe }}
          </div>
        </div>
      </div>
    {% endfor %}
  </div>
</section>
{% endblock %}
